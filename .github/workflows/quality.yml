name: PaketJet quality gates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: paketjet_test_ci
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: paketjet_test_ci
      PAYMENT_PROVIDER: disabled
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /tmp/paketjet-ci-uploads
      FRONTEND_URL: http://localhost:3000
      PUBLIC_URL: http://localhost:8078
      API_INTERNAL_URL: http://localhost:8078
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate isolated secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "COOKIE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CUSTOMER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CARRIER_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun run db:seed
        working-directory: backend
      - run: bun scripts/renewal-migrate.ts --apply
        working-directory: backend
      - run: bun test src/test/
        working-directory: backend
      - run: bun run build
        working-directory: backend
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run test && bun run lint && NODE_ENV=production bun run build
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: admin_panel
      - run: bun run test && bun run lint && NODE_ENV=production NEXT_PUBLIC_PANEL_API_URL=/api bun run build
        working-directory: admin_panel
